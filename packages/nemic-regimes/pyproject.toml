[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemic-regimes"
version = "0.1.0"
description = "Evidence-labelled conditional analogues for NEM interconnector dispatch limits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=15"]

[project.optional-dependencies]
models = ["scikit-learn==1.6.1", "lightgbm==4.6.0", "joblib==1.4.2"]
collect = ["requests>=2.31", "certifi"]

[project.scripts]
nemic-regimes = "nemic_regimes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nemic_regimes = ["static/*.html"]
